# Раздел ядра muse → блоки, по порядку. Снято прогоном функции-диспетчера
# 0xa9b9dc0 (таблица переходов 0x786d40) для каждого номера: она зависит только
# от номера. block — имя блока; text — где текст: "core 0x…" (вшит в ядро),
# "file" (файл P/hatch-agent/prompts/<имя>), literal — запись без имени со вставкой.
# via = "other_harness" — диспетчер не отдаёт раздел (None); такие разделы стоят
# только в срезе 1 профилей — разделы другой обвязки (флаг
# system_prompt_harness_overrides; срез отдают 0xcdb6520/0xcdb1920, отрисовщик
# 0xcd56910 читает только срез 0), в системный текст стандартной обвязки не идут;
# via = "unresolved" — разбор не закончен.


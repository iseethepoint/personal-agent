# Реестр моделей агента — та же форма, что у muse `model_registry::registry_file`
# (muse-live core-v2-analysis/strings-all.txt:235532-237160).
#
# [defaults]       модель главного разговора и всех задач без переопределения (model),
#                  модель сжатия и сброса памяти (maintenance), модель эмбеддингов
#                  (embeddings; нет — векторный поиск выключен, ищем по словам).
# [weights.NAME]   одни веса: окно, порог сжатия (не больше окна), умения.
#                  Умения пишутся под поставщика: anthropic.* или openai_compat.*.
#                  Нет умения — оно выключено. Незнакомое имя — ошибка загрузки.
# [wires]          имя модели у поставщика → веса; local_inference — модель на своей машине.
# [[models]]       выбираемые модели: поставщик, имя у поставщика, адрес, имя переменной
#                  с ключом; setup — переопределения по задачам.
#
# Ключи — только в переменных окружения; здесь пишется лишь имя переменной.

[defaults]
model = "anthropic/claude-opus-5-5"
maintenance = "anthropic/claude-haiku-4-5"

# Веса `cedar` у muse — это claude-opus-5-5 (strings-all.txt:235795-235806, :236080).
# compaction и tool_search у muse включены; здесь выключены, пока прослойка их
# не умеет (карточка П2б: только thinking, effort, cache_control).
[weights."claude-opus-5-5"]
knowledge_cutoff = "2026-06-30"
context_window = 1000000
# Порог сжатия muse по умолчанию — 150 000 токенов (ядро, функция 0x20954580).
compaction_trigger = 150000
anthropic.adaptive_thinking = true
anthropic.omit_thinking_display = false
anthropic.mid_conversation_system_messages = true
anthropic.compaction = false
anthropic.tool_search = false
anthropic.output_effort = "supported"
anthropic.image_resolution = "high"
anthropic.runtime_output_ceiling = 64000

# claude-haiku-4.5 у muse (strings-all.txt:235857-235863).
[weights."claude-haiku-4.5"]
knowledge_cutoff = "2026-01-04"
context_window = 200000
compaction_trigger = 150000
anthropic.adaptive_thinking = false
anthropic.output_effort = "unsupported"
anthropic.image_resolution = "standard"

# Локальная модель через сервер «как OpenAI» (Ollama). Окно и порог — как запущен
# сервер; подбирается под свою модель (план, П7).
[weights."qwen3-8b"]
context_window = 32768
compaction_trigger = 24576
openai_compat.vision = false
openai_compat.tool_output_error_status = false
openai_compat.reasoning = true
openai_compat.parallel_tool_calls = false
openai_compat.developer_role = true
openai_compat.runtime_output_ceiling = 8192

[wires]
"claude-opus-5-5" = { weights = "claude-opus-5-5" }
"claude-haiku-4-5" = { weights = "claude-haiku-4.5" }
"qwen3:8b" = { weights = "qwen3-8b", local_inference = true }

[[models]]
id = "anthropic/claude-opus-5-5"
display_name = "Claude Opus 5.5"
provider = "anthropic"
model = "claude-opus-5-5"
api_key_env = "ANTHROPIC_API_KEY"

[[models]]
id = "anthropic/claude-haiku-4-5"
display_name = "Claude Haiku 4.5"
provider = "anthropic"
model = "claude-haiku-4-5"
api_key_env = "ANTHROPIC_API_KEY"

[[models]]
id = "local/qwen3-8b"
display_name = "Qwen3 8B (Ollama)"
provider = "openai_compat"
model = "qwen3:8b"
base_url = "http://127.0.0.1:11434/v1"
# Как у muse `baby_willow` (strings-all.txt:237147-237151): когда выбрана слабая
# модель, браузер и сжатие идут на другой.
setup.overrides = [
  { purpose = "BrowserAgent", model = "anthropic/claude-opus-5-5" },
  { purpose = "BrowserMain", model = "anthropic/claude-opus-5-5" },
]

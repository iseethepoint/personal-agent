[package]
name = "agent-tools"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
agent-loop = { path = "../loop" }
agent-model = { path = "../model" }
serde_json = "1"
tokio = { version = "1", features = ["fs", "process", "io-util", "sync", "time", "rt"] }
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
regex = "1"
fst = "0.4"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
agent-browser = { path = "../browser" }
agent-cron = { path = "../cron" }
agent-goals = { path = "../goals" }
agent-memory = { path = "../memory" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

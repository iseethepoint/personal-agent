[package]
name = "agent-workflows"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
agent-loop = { path = "../loop" }
agent-model = { path = "../model" }
# Движок JS и проверка схем — те же крейты и версии, что в ядре muse
# (`source-files.txt`: boa_engine-0.21.1, jsonschema-0.46.4).
boa_engine = "=0.21.1"
jsonschema = { version = "=0.46.4", default-features = false }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
tokio = { version = "1", features = ["fs", "rt", "sync", "time", "macros"] }
futures-util = { version = "0.3", default-features = false }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "json", "chrono"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
libc = "0.2"

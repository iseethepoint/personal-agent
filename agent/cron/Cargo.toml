[package]
name = "agent-cron"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
agent-loop = { path = "../loop" }
agent-model = { path = "../model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["fs", "rt", "time", "sync", "macros", "process", "io-util"] }
futures-util = { version = "0.3", default-features = false }
# Клиент базы — как у muse (sqlx-postgres-0.8.6, core-v2-analysis/crates.txt).
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
libc = "0.2"
agent-memory = { path = "../memory" }
